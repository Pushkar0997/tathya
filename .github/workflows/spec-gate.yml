# The CI gate that cannot be skipped: pre-commit hooks can be bypassed with --no-verify.
name: spec-gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Spec lint, data validation and tests
        run: bash scripts/spec-gate.sh ci
